<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情感中枢系统 - 大神圆桌</title>
<style>
  :root {
    --bg: #0b1120;
    --panel: #111a2e;
    --panel-2: #16203a;
    --line: #23304f;
    --text: #dbe4ff;
    --dim: #8393bb;
    --cyan: #38bdf8;
    --green: #34d399;
    --amber: #fbbf24;
    --red: #f87171;
    --pink: #f472b6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    height: 100vh; display: flex; flex-direction: column; padding: 14px 18px 16px;
  }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  header h1 { font-size: 18px; letter-spacing: 1px; }
  header h1 span { color: var(--pink); }
  header .sub { color: var(--dim); font-size: 12px; }
  header .spacer { flex: 1; }
  button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--cyan); color: var(--cyan); }
  button.primary { background: #0e7490; border-color: #0e7490; color: #fff; }
  button.primary:hover { background: #0891b2; color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .layout { flex: 1; display: grid; grid-template-columns: 320px 1fr; gap: 14px; min-height: 0; }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; display: flex; flex-direction: column; min-height: 0;
  }
  .panel h2 { font-size: 13px; color: var(--cyan); margin-bottom: 10px; padding-left: 8px; border-left: 3px solid var(--cyan); }
  label { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 4px; }
  input[type=text], textarea, select {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    font-size: 13px; font-family: inherit;
  }
  textarea { resize: none; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .list { margin-top: 10px; overflow-y: auto; flex: 1; min-height: 90px; }
  .expert {
    display: flex; align-items: center; gap: 8px; padding: 7px 6px;
    border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  .expert:hover { background: var(--panel-2); }
  .expert input { accent-color: var(--cyan); }
  .expert .meta { color: var(--dim); font-size: 11px; }
  .expert .grow { flex: 1; min-width: 0; }
  .expert .name { display: flex; align-items: center; gap: 6px; }
  .tag { font-size: 10px; color: var(--amber); border: 1px solid rgba(251,191,36,.4); border-radius: 4px; padding: 0 4px; }
  .hint { color: var(--dim); font-size: 11px; line-height: 1.6; margin-top: 8px; }
  .stage { flex: 1; overflow-y: auto; padding-right: 4px; display: flex; flex-direction: column; gap: 10px; }
  .turn { border-left: 3px solid var(--line); padding: 6px 10px; background: var(--panel-2); border-radius: 0 8px 8px 0; }
  .turn .who { font-size: 12px; color: var(--cyan); margin-bottom: 4px; }
  .turn .who .round { color: var(--dim); font-weight: normal; margin-left: 6px; }
  .turn .what { font-size: 13px; line-height: 1.75; white-space: pre-wrap; }
  .synth { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: rgba(56,189,248,.05); }
  .synth b { color: var(--green); font-size: 12px; }
  .synth div { font-size: 12px; line-height: 1.8; color: var(--text); }
  .status { font-size: 12px; color: var(--dim); }
  .status.err { color: var(--red); }
  .empty { color: var(--dim); font-size: 12px; text-align: center; padding: 24px 0; }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  .working { animation: pulse 1.6s infinite; }
</style>
</head>
<body>
<header>
  <h1>大神<span>圆桌</span></h1>
  <span class="sub">联网取公开语料 → 蒸馏人格 → 二次筛查 → 让他们自己吵</span>
  <span class="spacer"></span>
  <span id="status" class="status"></span>
  <button onclick="location.href='/index.html'">返回主页</button>
</header>

<div class="layout">
  <div class="panel">
    <h2>大神库</h2>
    <label>蒸馏新大神</label>
    <div class="row">
      <input type="text" id="new-name" placeholder="名字，如 于旸 / 余弦">
      <input type="text" id="new-field" placeholder="领域" value="网络安全" style="max-width: 96px;">
    </div>
    <input type="text" id="new-hint" placeholder="补充线索（可选）：网名、机构、代表作" style="margin-top: 8px;">
    <textarea id="new-urls" rows="3" placeholder="资料链接（可选，每行一条）：访谈/演讲/博客原文，最多 5 条。填了就只用这几篇，不再联网搜" style="margin-top: 8px;"></textarea>
    <button class="primary" id="distill-btn" style="margin-top: 8px;" onclick="startDistill()">开始蒸馏</button>
    <div class="hint">只收公开访谈/演讲/博客；原话必须能在正文里逐字找到，机构职务要过模型复核，核不上的直接删。</div>
    <div class="list" id="expert-list"><div class="empty">还没有人，先蒸一个</div></div>
    <div class="hint">勾选 2~4 位进圆桌（最多 5 位）。</div>
  </div>

  <div class="panel">
    <h2>圆桌</h2>
    <label>议题</label>
    <textarea id="topic" rows="2" placeholder="例：AI 自动化挖洞会让漏洞研究这门手艺消失吗？"></textarea>
    <div class="row" style="margin-top: 8px; align-items: center;">
      <button class="primary" id="run-btn" onclick="runRoundtable()">开庭</button>
      <select id="rounds" style="max-width: 120px;">
        <option value="1">1 轮</option>
        <option value="2" selected>2 轮</option>
        <option value="3">3 轮</option>
      </select>
    </div>
    <div class="stage" id="stage" style="margin-top: 12px;"><div class="empty">选人、写议题，然后开庭</div></div>
  </div>
</div>

<script>
const sessionId = localStorage.getItem('sessionId') || '';
let experts = [];
let selected = new Set();
let running = false;

const statusEl = document.getElementById('status');

function setStatus(text, isError) {
  statusEl.textContent = text || '';
  statusEl.className = 'status' + (isError ? ' err' : '');
  statusEl.classList.toggle('working', !!text && !isError);
}

async function api(url, options = {}) {
  const res = await fetch(url, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      'x-session-id': sessionId,
      ...(options.headers || {})
    }
  });
  if (res.status === 401) throw new Error('请先登录再回来');
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.success === false) throw new Error(data.message || '请求失败');
  return data;
}

function esc(text) {
  return String(text == null ? '' : text).replace(/[&<>"']/g, (ch) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
  ));
}

async function loadExperts() {
  try {
    const data = await api('/api/experts');
    experts = data.experts || [];
    renderExperts();
  } catch (error) {
    setStatus(error.message, true);
  }
}

function renderExperts() {
  const box = document.getElementById('expert-list');
  if (!experts.length) {
    box.innerHTML = '<div class="empty">还没有人，先蒸一个</div>';
    return;
  }
  box.innerHTML = experts.map((item) => `
    <label class="expert">
      <input type="checkbox" ${selected.has(item.id) ? 'checked' : ''} onchange="toggleExpert('${esc(item.id)}', this.checked)">
      <div class="grow">
        <div class="name">${esc(item.name)}${item.title ? `<span class="tag">${esc(item.title.slice(0, 12))}</span>` : ''}</div>
        <div class="meta">${esc(item.field || '')} · ${item.stanceCount} 条观点 · ${item.sourceCount} 篇语料${item.droppedCount ? ` · 筛掉 ${item.droppedCount}` : ''}</div>
      </div>
    </label>
  `).join('');
}

function toggleExpert(id, checked) {
  if (checked) {
    if (selected.size >= 4) {
      setStatus('一场最多 4 位（再多就散场了）', true);
      renderExperts();
      return;
    }
    selected.add(id);
  } else {
    selected.delete(id);
  }
  renderExperts();
}

async function startDistill() {
  if (running) return;
  const name = document.getElementById('new-name').value.trim();
  if (!name) return setStatus('先给个名字', true);
  running = true;
  const btn = document.getElementById('distill-btn');
  btn.disabled = true;
  const started = Date.now();
  const tick = setInterval(() => {
    setStatus(`正在检索并蒸馏「${name}」… ${Math.round((Date.now() - started) / 1000)}s`);
  }, 1000);
  setStatus(`正在检索并蒸馏「${name}」…`);
  try {
    const urls = document.getElementById('new-urls').value
      .split('\n')
      .map((line) => line.trim())
      .filter((line) => /^https?:\/\//i.test(line))
      .slice(0, 5);
    const data = await api('/api/experts/distill', {
      method: 'POST',
      body: JSON.stringify({
        name,
        field: document.getElementById('new-field').value.trim() || '网络安全',
        hint: document.getElementById('new-hint').value.trim(),
        urls
      })
    });
    const expert = data.expert || {};
    setStatus(`蒸好了：${expert.name}，保留 ${(expert.stances || []).length} 条观点，筛掉 ${(expert.screen && expert.screen.dropped) || 0} 条没依据的`);
    document.getElementById('new-name').value = '';
    document.getElementById('new-hint').value = '';
    await loadExperts();
  } catch (error) {
    setStatus(error.message, true);
  } finally {
    clearInterval(tick);
    btn.disabled = false;
    running = false;
  }
}

function renderTurn(turn) {
  const stage = document.getElementById('stage');
  const empty = stage.querySelector('.empty');
  if (empty) empty.remove();
  const el = document.createElement('div');
  el.className = 'turn';
  el.innerHTML = `<div class="who">${esc(turn.name)}<span class="round">第 ${turn.round} 轮</span></div>
    <div class="what">${esc(turn.text)}</div>`;
  stage.appendChild(el);
  stage.scrollTop = stage.scrollHeight;
}

function renderSynthesis(synthesis) {
  const stage = document.getElementById('stage');
  const blocks = [];
  if (synthesis.disagreements && synthesis.disagreements.length) {
    blocks.push(`<b>分歧</b><div>${synthesis.disagreements.map((item) => {
      const positions = (item.positions || []).map((p) => `${esc(p.name)}：${esc(p.stance)}`).join('<br>');
      return `· ${esc(item.topic)}<br>${positions}`;
    }).join('<br>')}</div>`);
  }
  if (synthesis.strongest && synthesis.strongest.length) {
    blocks.push(`<b>最硬的论据</b><div>${synthesis.strongest.map((item) => `· ${esc(item)}`).join('<br>')}</div>`);
  }
  if (synthesis.followups && synthesis.followups.length) {
    blocks.push(`<b>值得追问</b><div>${synthesis.followups.map((item) => `· ${esc(item)}`).join('<br>')}</div>`);
  }
  if (!blocks.length) blocks.push(`<b>归纳</b><div>${esc(synthesis.raw || '这场没归纳出结构')}</div>`);
  const el = document.createElement('div');
  el.className = 'synth';
  el.innerHTML = blocks.join('<div style="height:8px"></div>');
  stage.appendChild(el);
  stage.scrollTop = stage.scrollHeight;
}

async function runRoundtable() {
  if (running) return;
  const topic = document.getElementById('topic').value.trim();
  if (!topic) return setStatus('议题不能为空', true);
  if (selected.size < 2) return setStatus('至少勾两位大神', true);

  running = true;
  const btn = document.getElementById('run-btn');
  btn.disabled = true;
  document.getElementById('stage').innerHTML = '';
  setStatus('圆桌开始，逐条输出中…');

  try {
    const res = await fetch('/api/experts/roundtable', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-session-id': sessionId },
      body: JSON.stringify({
        topic,
        expertIds: [...selected],
        rounds: Number(document.getElementById('rounds').value) || 2
      })
    });
    if (res.status === 401) throw new Error('请先登录再回来');
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.message || '圆桌开不起来');
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let index;
      while ((index = buffer.indexOf('\n')) !== -1) {
        const line = buffer.slice(0, index).trim();
        buffer = buffer.slice(index + 1);
        if (!line) continue;
        let event;
        try { event = JSON.parse(line); } catch { continue; }
        if (event.type === 'turn') renderTurn(event.turn);
        else if (event.type === 'done') renderSynthesis(event.roundtable.synthesis || {});
        else if (event.type === 'error') throw new Error(event.message || '圆桌中断');
      }
    }
    setStatus('散场');
  } catch (error) {
    setStatus(error.message, true);
  } finally {
    btn.disabled = false;
    running = false;
  }
}

if (!sessionId) setStatus('未登录：请先在主页登录', true);
loadExperts();
</script>
</body>
</html>
