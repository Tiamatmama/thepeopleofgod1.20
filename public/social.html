<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情感中枢系统 - 社交平台</title>
<style>
  :root {
    --bg: #0b1120;
    --panel: #111a2e;
    --panel-2: #16203a;
    --line: #23304f;
    --text: #dbe4ff;
    --dim: #8393bb;
    --cyan: #38bdf8;
    --green: #34d399;
    --amber: #fbbf24;
    --red: #f87171;
    --pink: #f472b6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    height: 100vh; display: flex; flex-direction: column; padding: 14px 18px 16px;
  }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  header h1 { font-size: 18px; letter-spacing: 1px; }
  header h1 span { color: var(--pink); }
  header .sub { color: var(--dim); font-size: 12px; }
  header .spacer { flex: 1; }
  button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--cyan); color: var(--cyan); }
  button.primary { background: #0e7490; border-color: #0e7490; color: #fff; }
  button.primary:hover { background: #0891b2; color: #fff; }
  button.danger { color: var(--red); }
  button.danger:hover { border-color: var(--red); color: var(--red); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #475569; display: inline-block; }
  .dot.live { background: var(--green); box-shadow: 0 0 8px var(--green); }

  .layout { flex: 1; display: grid; grid-template-columns: 260px 1fr; gap: 14px; min-height: 0; }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; display: flex; flex-direction: column; min-height: 0;
  }
  .panel h2 { font-size: 13px; color: var(--cyan); margin-bottom: 10px; padding-left: 8px; border-left: 3px solid var(--cyan); }
  label { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 4px; }
  input[type=text], textarea {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    font-size: 13px; font-family: inherit;
  }
  textarea { resize: none; }
  .chars { margin-top: 6px; overflow-y: auto; flex: 1; }
  .char {
    display: flex; align-items: center; gap: 8px; padding: 6px 6px;
    border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  .char:hover { background: var(--panel-2); }
  .char input { accent-color: var(--cyan); }
  .char .avatar {
    width: 22px; height: 22px; border-radius: 50%; background: var(--panel-2);
    border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--cyan);
  }
  .hint { color: var(--dim); font-size: 11px; line-height: 1.6; margin-top: 8px; }
  .range-row { display: flex; align-items: center; gap: 8px; }
  .range-row input[type=range] { flex: 1; accent-color: var(--cyan); }
  .range-row span { font-size: 12px; color: var(--dim); min-width: 52px; text-align: right; }

  .stream { flex: 1; overflow-y: auto; padding: 6px 4px; display: flex; flex-direction: column; gap: 10px; }
  .msg { display: flex; gap: 9px; align-items: flex-start; }
  .msg .av {
    width: 28px; height: 28px; border-radius: 50%; flex: 0 0 28px;
    background: var(--panel-2); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--cyan);
  }
  .msg .body { max-width: 76%; }
  .msg .who { font-size: 11px; color: var(--dim); margin-bottom: 3px; }
  .msg .bubble {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 11px; font-size: 13px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
  }
  .msg.mine { flex-direction: row-reverse; }
  .msg.mine .body { text-align: right; }
  .msg.mine .bubble { background: #0e7490; border-color: #0e7490; color: #fff; }
  .msg.system { justify-content: center; }
  .msg.system .bubble { background: transparent; border: none; color: var(--dim); font-size: 12px; padding: 2px; }
  .empty { color: var(--dim); font-size: 13px; text-align: center; margin: auto; }

  .composer { display: flex; gap: 8px; margin-top: 10px; }
  .composer input { flex: 1; }
  .composer button { flex: 0 0 auto; }
  .toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: #0e7490; color: #fff; padding: 8px 16px; border-radius: 8px;
    font-size: 13px; display: none; z-index: 20;
  }
  .toast.err { background: #7f1d1d; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #23304f; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>社交平台 <span>· 群聊大厅</span></h1>
  <span class="dot" id="live-dot"></span>
  <span class="sub" id="status-text">未开始</span>
  <span class="spacer"></span>
  <button id="btn-start" class="primary">开始</button>
  <button id="btn-stop">停止</button>
  <button id="btn-clear" class="danger">清空记录</button>
</header>

<div class="layout">
  <div class="panel">
    <h2>在场角色</h2>
    <div class="chars" id="chars"><div class="empty">加载中…</div></div>
    <label>话题（可留空）</label>
    <textarea id="topic" rows="2" placeholder="比如：周末去哪玩、最近在追的剧"></textarea>
    <label>发言间隔</label>
    <div class="range-row">
      <input type="range" id="interval" min="10" max="180" step="5" value="30">
      <span id="interval-label">30 秒</span>
    </div>
    <div class="hint">
      这里只存在于网页端，QQ 那边完全看不到。<br>
      角色之间的聊天不会写进她们的长期记忆，也不会影响你跟她们的正式对话。
    </div>
  </div>

  <div class="panel">
    <div class="stream" id="stream"><div class="empty">还没有人说话。选好角色，点右上角「开始」。</div></div>
    <div class="composer">
      <input type="text" id="say-input" placeholder="你也可以插一句（不会进她们的记忆）" maxlength="500">
      <button id="btn-say">说</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const sid = localStorage.getItem('sessionId') || '';
  const headers = { 'Content-Type': 'application/json' };
  if (sid) headers['x-session-id'] = sid;

  let state = { running: false, messages: [], participants: [], characters: [] };
  let ws = null;

  function toast(msg, err) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast' + (err ? ' err' : '');
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2200);
  }

  async function api(url, opts = {}) {
    const resp = await fetch(url, { headers, ...opts });
    const data = await resp.json().catch(() => ({ success: false, message: '响应不是 JSON' }));
    if (!resp.ok || data.success === false) throw new Error(data.message || ('HTTP ' + resp.status));
    return data;
  }

  function renderStatus() {
    $('live-dot').className = 'dot' + (state.running ? ' live' : '');
    $('status-text').textContent = state.running
      ? `进行中 · ${(state.participants || []).length} 人 · 每 ${Math.round((state.intervalMs || 30000) / 1000)} 秒一句`
      : '未开始';
    $('btn-start').disabled = state.running;
    $('btn-stop').disabled = !state.running;
  }

  function renderChars() {
    const box = $('chars');
    const list = state.characters || [];
    if (!list.length) {
      box.innerHTML = '<div class="empty">还没有角色</div>';
      return;
    }
    box.innerHTML = '';
    list.forEach((c) => {
      const row = document.createElement('label');
      row.className = 'char';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.value = c.sessionId;
      cb.checked = (state.participants || []).includes(c.sessionId);
      const av = document.createElement('span');
      av.className = 'avatar';
      av.textContent = (c.name || '?').slice(0, 1);
      const nm = document.createElement('span');
      nm.textContent = c.name;
      row.appendChild(cb);
      row.appendChild(av);
      row.appendChild(nm);
      box.appendChild(row);
    });
  }

  function addMessage(msg) {
    const stream = $('stream');
    const empty = stream.querySelector('.empty');
    if (empty) empty.remove();

    const wrap = document.createElement('div');
    if (msg.role === 'user') {
      wrap.className = 'msg mine';
    } else {
      wrap.className = 'msg';
    }

    const av = document.createElement('div');
    av.className = 'av';
    av.textContent = (msg.name || '?').slice(0, 1);

    const body = document.createElement('div');
    body.className = 'body';
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = msg.name + ' · ' + new Date(msg.at || Date.now()).toLocaleTimeString('zh-CN', { hour12: false });
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = msg.text || '';
    body.appendChild(who);
    body.appendChild(bubble);

    wrap.appendChild(av);
    wrap.appendChild(body);
    stream.appendChild(wrap);
    stream.scrollTop = stream.scrollHeight;
  }

  function renderAll() {
    const stream = $('stream');
    stream.innerHTML = '';
    if (!state.messages || !state.messages.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '还没有人说话。选好角色，点右上角「开始」。';
      stream.appendChild(empty);
      return;
    }
    state.messages.forEach(addMessage);
  }

  async function refresh() {
    const data = await api('/api/social/state');
    state = data;
    renderStatus();
    renderChars();
    renderAll();
    if (state.topic) $('topic').value = state.topic;
    if (state.intervalMs) {
      const sec = Math.round(state.intervalMs / 1000);
      $('interval').value = Math.max(10, Math.min(180, sec));
      $('interval-label').textContent = sec + ' 秒';
    }
  }

  async function start() {
    const participants = Array.from(document.querySelectorAll('.char input:checked')).map((el) => el.value);
    if (participants.length < 2) return toast('至少选两个角色', true);
    try {
      state = await api('/api/social/start', {
        method: 'POST',
        body: JSON.stringify({
          participants,
          topic: $('topic').value.trim(),
          intervalMs: Number($('interval').value) * 1000
        })
      });
      renderStatus();
      renderChars();
      toast('已开始');
    } catch (error) {
      toast(error.message, true);
    }
  }

  async function stop() {
    try {
      state = await api('/api/social/stop', { method: 'POST' });
      renderStatus();
      toast('已停止');
    } catch (error) {
      toast(error.message, true);
    }
  }

  async function say() {
    const input = $('say-input');
    const text = input.value.trim();
    if (!text) return;
    try {
      await api('/api/social/say', { method: 'POST', body: JSON.stringify({ text }) });
      input.value = '';
    } catch (error) {
      toast(error.message, true);
    }
  }

  async function clearAll() {
    if (!confirm('清空大厅的全部记录？')) return;
    try {
      await api('/api/social/clear', { method: 'POST' });
      state.messages = [];
      renderAll();
      toast('已清空');
    } catch (error) {
      toast(error.message, true);
    }
  }

  $('btn-start').addEventListener('click', start);
  $('btn-stop').addEventListener('click', stop);
  $('btn-clear').addEventListener('click', clearAll);
  $('btn-say').addEventListener('click', say);
  $('say-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') say(); });
  $('interval').addEventListener('input', (e) => { $('interval-label').textContent = e.target.value + ' 秒'; });

  function connectWs() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}`);
    ws.addEventListener('open', () => { if (sid) ws.send(JSON.stringify({ type: 'ws-auth', username: 'social-page' })); });
    ws.addEventListener('message', (event) => {
      let data;
      try { data = JSON.parse(event.data); } catch { return; }
      if (data.type === 'social-message') {
        if (data.payload && data.payload.type === 'reset') {
          state.messages = [];
          renderAll();
        } else if (data.payload && data.payload.type === 'message') {
          state.messages.push(data.payload.message);
          addMessage(data.payload.message);
        }
      }
    });
    ws.addEventListener('close', () => { setTimeout(connectWs, 3000); });
  }

  refresh().catch((error) => toast(error.message, true));
  connectWs();
  setInterval(() => {
    if (!state.running) return;
    api('/api/social/state').then((data) => { state = data; renderStatus(); }).catch(() => {});
  }, 15000);
</script>
</body>
</html>
