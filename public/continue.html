<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>情感中枢系统控制面板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#6366f1',
            secondary: '#8b5cf6',
            accent: '#ec4899',
            dark: '#1e293b',
            light: '#f8fafc'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .glass {
        @apply bg-white/10 backdrop-blur-md border border-white/20;
      }
      .card {
        @apply glass rounded-xl p-6 shadow-lg hover:shadow-xl transition-all duration-300;
      }
      .btn {
        @apply px-4 py-2 rounded-lg font-medium transition-all duration-300;
      }
      .btn-primary {
        @apply bg-primary text-white hover:bg-primary/90;
      }
      .btn-secondary {
        @apply bg-secondary text-white hover:bg-secondary/90;
      }
      .btn-outline {
        @apply border border-primary text-primary hover:bg-primary hover:text-white;
      }
      .btn-danger {
        @apply bg-red-500 text-white hover:bg-red-600;
      }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-800 min-h-screen text-white">
  <div class="container mx-auto px-4 py-8">
    <!-- 头部 -->
    <header class="mb-8 text-center">
      <h1 class="text-4xl font-bold mb-2">情感中枢系统控制面板</h1>
      <p class="text-lg text-gray-300">实时检测服务器和脚本状态 · 一键启动服务</p>
    </header>

    <!-- 控制面板 -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
      <!-- 服务器控制 -->
      <div class="card">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-semibold"><i class="fa fa-server mr-2"></i>服务器控制</h2>
          <span id="server-status" class="px-3 py-1 rounded-full bg-red-500 text-xs">检测中...</span>
        </div>
        <div class="space-y-4">
          <button id="start-server" class="btn btn-primary w-full flex items-center justify-center">
            <i class="fa fa-play mr-2"></i>启动服务器
          </button>
          <button id="stop-server" class="btn btn-danger w-full flex items-center justify-center" disabled>
            <i class="fa fa-stop mr-2"></i>停止服务器
          </button>
          <div class="text-sm text-gray-300">
            <p>端口: <span id="server-port">41888</span></p>
            <p>状态: <span id="server-status-text">检测中...</span></p>
          </div>
        </div>
      </div>

      <!-- 系统状态 -->
      <div class="card">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-semibold"><i class="fa fa-dashboard mr-2"></i>系统状态</h2>
          <span id="system-status" class="px-3 py-1 rounded-full bg-yellow-500 text-xs">未知</span>
        </div>
        <div class="space-y-4">
          <button id="check-status" class="btn btn-outline w-full flex items-center justify-center">
            <i class="fa fa-refresh mr-2"></i>刷新状态
          </button>
          <div class="text-sm text-gray-300 space-y-2">
            <p>情绪: <span id="emotion-status">未知</span></p>
            <p>关系: <span id="relationship-status">未知</span></p>
            <p>记忆: <span id="memory-count">0</span> 条</p>
            <p>过滤阻止: <span id="filter-blocked">0</span> 条</p>
          </div>
        </div>
      </div>
    </div>

    <!-- 开发者日志 -->
    <div class="card mb-8">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-semibold"><i class="fa fa-file-text mr-2"></i>开发者日志</h2>
        <div class="flex space-x-2">
          <button id="refresh-log" class="btn btn-outline flex items-center">
            <i class="fa fa-refresh mr-1"></i>刷新
          </button>
          <button id="clear-log" class="btn btn-danger flex items-center">
            <i class="fa fa-trash mr-1"></i>清空
          </button>
        </div>
      </div>
      <div class="bg-black/30 rounded-lg p-4 h-96 overflow-y-auto font-mono text-sm">
        <pre id="developer-log" class="whitespace-pre-wrap">加载中...</pre>
      </div>
    </div>

    <!-- 快速操作 -->
    <div class="card">
      <h2 class="text-xl font-semibold mb-4"><i class="fa fa-bolt mr-2"></i>快速操作</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <a href="http://localhost:41888" target="_blank" class="btn btn-outline w-full flex items-center justify-center">
          <i class="fa fa-external-link mr-2"></i>打开前端界面
        </a>
        <a href="http://localhost:41888/api/status" target="_blank" class="btn btn-outline w-full flex items-center justify-center">
          <i class="fa fa-info-circle mr-2"></i>查看API状态
        </a>
        <a href="../src/tools/developer.log" target="_blank" class="btn btn-outline w-full flex items-center justify-center">
          <i class="fa fa-file-text mr-2"></i>查看原始日志文件
        </a>
        <a href=".." target="_blank" class="btn btn-outline w-full flex items-center justify-center">
          <i class="fa fa-folder-open mr-2"></i>打开项目目录
        </a>
      </div>
    </div>
  </div>

  <!-- 底部 -->
  <footer class="mt-8 text-center text-gray-400 text-sm pb-8">
    <p>情感中枢系统 &copy; 2026</p>
  </footer>

  <script>
    const elements = {
      serverStatus: document.getElementById('server-status'),
      serverStatusText: document.getElementById('server-status-text'),
      startServer: document.getElementById('start-server'),
      stopServer: document.getElementById('stop-server'),
      systemStatus: document.getElementById('system-status'),
      emotionStatus: document.getElementById('emotion-status'),
      relationshipStatus: document.getElementById('relationship-status'),
      memoryCount: document.getElementById('memory-count'),
      developerLog: document.getElementById('developer-log'),
      checkStatus: document.getElementById('check-status'),
      refreshLog: document.getElementById('refresh-log'),
      clearLog: document.getElementById('clear-log')
    };

    // 实时检测服务器状态
    async function checkServerStatus() {
      try {
        const response = await fetch('http://localhost:41888/api/status', {
          method: 'GET',
          headers: { 'Content-Type': 'application/json' },
          timeout: 3000
        });
        
        if (response.ok) {
          elements.serverStatus.className = 'px-3 py-1 rounded-full bg-green-500 text-xs';
          elements.serverStatus.textContent = '运行中';
          elements.serverStatusText.textContent = '运行中';
          elements.startServer.disabled = true;
          elements.stopServer.disabled = false;
          return true;
        } else {
          throw new Error('Server returned non-ok status');
        }
      } catch (error) {
        elements.serverStatus.className = 'px-3 py-1 rounded-full bg-red-500 text-xs';
        elements.serverStatus.textContent = '未启动';
        elements.serverStatusText.textContent = '未启动';
        elements.startServer.disabled = false;
        elements.stopServer.disabled = true;
        return false;
      }
    }

    // 更新系统状态
    async function updateSystemStatus() {
      try {
        const response = await fetch('http://localhost:41888/api/status');
        
        if (response.ok) {
          const status = await response.json();
          
          const emotions = status.emotion;
          let dominantEmotion = 'calm';
          let maxIntensity = emotions.calm || 0;
          Object.entries(emotions).forEach(([emotion, intensity]) => {
            if (intensity > maxIntensity) {
              dominantEmotion = emotion;
              maxIntensity = intensity;
            }
          });
          
          elements.emotionStatus.textContent = `${dominantEmotion} (${Math.round(maxIntensity * 100)}%)`;
          elements.relationshipStatus.textContent = status.relationship.stageName;
          elements.memoryCount.textContent = status.memoryCount;
          
          elements.systemStatus.className = 'px-3 py-1 rounded-full bg-green-500 text-xs';
          elements.systemStatus.textContent = '正常';
        } else {
          throw new Error('Failed to fetch status');
        }
      } catch (error) {
        elements.systemStatus.className = 'px-3 py-1 rounded-full bg-yellow-500 text-xs';
        elements.systemStatus.textContent = '异常';
        elements.emotionStatus.textContent = '未知';
        elements.relationshipStatus.textContent = '未知';
        elements.memoryCount.textContent = '0';
      }
    }

    // 刷新日志
    async function refreshLog() {
      try {
        elements.developerLog.textContent = '加载中...';
        
        const response = await fetch('http://localhost:41888/api/logs');
        if (response.ok) {
          const logs = await response.json();
          elements.developerLog.textContent = logs.content || '暂无日志';
        } else {
          throw new Error('Failed to fetch logs');
        }
        
        elements.developerLog.scrollTop = elements.developerLog.scrollHeight;
      } catch (error) {
        elements.developerLog.textContent = `加载失败: ${error.message}`;
      }
    }

    // 启动服务器
    elements.startServer.addEventListener('click', async () => {
      elements.developerLog.textContent += '\n[系统] 正在尝试启动服务器...\n';
      elements.developerLog.textContent += `[提示] 请使用以下任一方式启动:\n`;
      elements.developerLog.textContent += `  1. 双击: scripts\\windows\\start_server.bat ⭐ 推荐\n`;
      elements.developerLog.textContent += `  2. 运行命令(项目根目录): node "src\\server\\index.js"\n\n`;
    });

    // 停止服务器
    elements.stopServer.addEventListener('click', async () => {
      elements.developerLog.textContent += '\n[系统] 正在停止服务器...\n';
      
      try {
        const response = await fetch('http://localhost:41888/api/process/stop/server', {
          method: 'POST'
        });
        
        if (response.ok) {
          const result = await response.json();
          elements.developerLog.textContent += `[系统] ${result.message}\n`;
          
          setTimeout(async () => {
            await checkServerStatus();
            await updateSystemStatus();
          }, 1000);
        }
      } catch (error) {
        elements.developerLog.textContent += `[提示] 请手动停止服务器: Get-Process node | Stop-Process -Force\n`;
      }
    });

    // 手动刷新状态
    elements.checkStatus.addEventListener('click', async () => {
      await checkServerStatus();
      await updateSystemStatus();
    });

    elements.refreshLog.addEventListener('click', refreshLog);

    elements.clearLog.addEventListener('click', () => {
      if (confirm('确定要清空日志吗？')) {
        elements.developerLog.textContent = '';
      }
    });

    // 初始化
    async function init() {
      elements.developerLog.textContent = '[系统] 控制面板加载完成，开始实时检测...\n';
      
      await checkServerStatus();
      await updateSystemStatus();
      
      setInterval(async () => {
        await checkServerStatus();
        await updateSystemStatus();
      }, 3000);
    }

    init();
  </script>
</body>
</html>
