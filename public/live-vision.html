<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>实时视觉</title>
<style>
  :root {
    --bg: #14171c;
    --panel: #1c2028;
    --line: #2c323d;
    --text: #e6e9ef;
    --muted: #8c95a5;
    --accent: #7ac88c;
    --bad: #e07b7b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100%; }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .5px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-size: 12px; color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 2px 9px; white-space: nowrap;
  }
  .chip[data-tone="ok"] { color: #a8d9b3; border-color: #3d5c46; }
  .chip[data-tone="bad"] { color: var(--bad); border-color: #5b3535; }
  .spacer { flex: 1; }
  .viewbar { display: flex; gap: 6px; }
  .viewbar button, .viewbar a {
    background: #262c37; color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 10px; font-size: 12px; cursor: pointer;
    text-decoration: none; line-height: 1.5;
  }
  .viewbar button:hover, .viewbar a:hover { border-color: #46536a; }
  .viewbar button:disabled { opacity: .45; cursor: default; }
  .viewbar button.on { border-color: var(--accent); color: #cfe3c4; }
  main { flex: 1; display: flex; min-height: 0; }
  .stage-col {
    flex: 1; min-width: 0; min-height: 0; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .stage {
    flex: 1 1 0; min-height: 0; overflow: hidden;
    position: relative; display: flex;
    align-items: center; justify-content: center; background: #0d0f13;
  }
  .frame {
    position: relative; width: 100%; height: 100%; min-height: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  #video, #overlay {
    width: 100%; height: 100%; object-fit: contain; display: block;
  }
  #video.mirror { transform: scaleX(-1); }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  .placeholder {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; color: #5f6878;
    font-size: 13px; text-align: center; pointer-events: none;
  }
  .placeholder b { color: #8c95a5; font-weight: 600; }
  .side {
    width: 320px; flex-shrink: 0; border-left: 1px solid var(--line);
    background: var(--panel); display: flex; flex-direction: column; min-height: 0;
  }
  .side section { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .side h2 {
    margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .8px;
    color: var(--muted); text-transform: uppercase;
  }
  #summary { font-size: 12.5px; line-height: 1.7; }
  #tracks { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
  .track {
    display: flex; justify-content: space-between; gap: 10px;
    font-size: 12px; padding: 5px 8px; border: 1px solid var(--line);
    border-radius: 7px; background: #222732;
  }
  .track-name { color: var(--text); }
  .track-meta { color: var(--muted); }
  .empty { font-size: 12px; color: #5f6878; }
  #log { flex: 1; overflow-y: auto; font-size: 11.5px; line-height: 1.6; color: var(--muted); }
  .log-line { padding: 1px 0; word-break: break-word; }
  .privacy { font-size: 11.5px; line-height: 1.7; color: var(--muted); }
  .privacy b { color: #a8d9b3; font-weight: 600; }

  /* 对话区：和主界面共用同一个角色 / 会话，不必来回切页面 */
  .chat {
    flex: 0 0 auto; height: 240px; min-height: 180px; display: flex; flex-direction: column;
    border-top: 1px solid var(--line); background: var(--panel);
  }
  .chat-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 7px 14px; border-bottom: 1px solid var(--line);
    font-size: 11px; letter-spacing: .5px; color: var(--muted);
  }
  .chat-log {
    flex: 1; overflow-y: auto; padding: 10px 14px;
    display: flex; flex-direction: column; gap: 8px;
    font-size: 13px; line-height: 1.65;
  }
  .msg-user {
    align-self: flex-end; max-width: 78%;
    background: #2b3444; padding: 6px 10px;
    border-radius: 10px 10px 2px 10px; white-space: pre-wrap;
  }
  .msg-ai {
    align-self: flex-start; max-width: 82%;
    background: #212a24; border: 1px solid #31402f; padding: 6px 10px;
    border-radius: 10px 10px 10px 2px; white-space: pre-wrap;
  }
  .chat-inputrow { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
  .chat-inputrow input {
    flex: 1; min-width: 0; background: #161a20; color: var(--text);
    border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px;
    font-size: 13px; outline: none;
  }
  .chat-inputrow input:focus { border-color: #46536a; }
  .chat-inputrow button {
    background: #2f6b45; color: #e8f5ec; border: 1px solid #3d7a52;
    border-radius: 7px; padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
  .chat-inputrow button:disabled { opacity: .5; cursor: default; }

  @media (max-width: 900px) {
    main { flex-direction: column; }
    .side { width: 100%; border-left: none; border-top: 1px solid var(--line); max-height: 40%; }
    .chat { height: 200px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>实时视觉</h1>
    <div class="chips">
      <span class="chip" id="status">未开启</span>
      <span class="chip" id="fpsChip">0 fps</span>
      <span class="chip" id="trackChip">0 个目标</span>
      <span class="chip" id="uploadChip">未上报</span>
    </div>
    <div class="spacer"></div>
    <div class="viewbar">
      <button id="startBtn">开启摄像头</button>
      <button id="stopBtn" disabled>停止</button>
      <button id="mirrorBtn">镜像</button>
      <a href="/">返回首页</a>
    </div>
  </header>

  <main>
    <div class="stage-col">
      <div class="stage">
        <div class="frame">
          <video id="video" playsinline muted></video>
          <canvas id="overlay"></canvas>
          <div class="placeholder" id="placeholder">
            <b>还没有画面</b>
            <span>点右上角「开启摄像头」。检测在浏览器里完成，视频不会上传。</span>
          </div>
        </div>
      </div>

      <section class="chat">
        <div class="chat-head">
          <span>对话</span>
          <span id="chatHint">正在读取主界面的角色…</span>
        </div>
        <div class="chat-log" id="chat-log">
          <div class="empty">在这里说一句，她会结合看到的画面回应。</div>
        </div>
        <div class="chat-inputrow">
          <input id="chat-input" type="text" placeholder="说点什么…（Enter 发送）" autocomplete="off" />
          <button id="chat-send">发送</button>
        </div>
      </section>
    </div>

    <aside class="side">
      <section>
        <h2>她此刻看到的</h2>
        <div id="summary">等待画面…</div>
      </section>
      <section>
        <h2>识别到的目标</h2>
        <div id="tracks"><div class="empty">画面里暂时没认出东西</div></div>
      </section>
      <section class="privacy">
        <h2>隐私</h2>
        <div>视频帧只在本机浏览器里做推理，<b>原图不出本机</b>；服务端只收到「什么物体、大概在哪、多大、什么手势、什么表情、朝向和姿势」这类结构化结果，进程重启即清空。</div>
      </section>
      <section style="flex:1; display:flex; flex-direction:column; min-height:0; border-bottom:none;">
        <h2>运行日志</h2>
        <div id="log"></div>
      </section>
    </aside>
  </main>
</div>
<script src="/live-vision.js"></script>
</body>
</html>
