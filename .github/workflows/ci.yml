name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.x']
    steps:
      - uses: actions/checkout@v4

      - name: 使用 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: 安装依赖（锁定版本）
        run: npm ci

      - name: 代码检查（ESLint + 循环依赖 + 分层方向）
        run: npm run lint

      - name: 单元 / 集成测试
        run: npm test
